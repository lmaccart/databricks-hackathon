name: Layout SIMD decoder diagnostic

on:
  push:
    branches: ["trial/099-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Download and verify the official generator
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -eu
          curl --fail --silent --show-error --location --retry 2 \
            "https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip" \
            -o generator.zip
          echo '13724cadbac5a99d847e27cea911cd2e338ff972b46c2039da87452011bb101e  generator.zip' | sha256sum -c -
          unzip -q generator.zip
          cargo +1.100.0 build --release --locked --manifest-path generator/Cargo.toml
      - name: Generate both 20M practice inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          generator/target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output practice-7
          generator/target/release/generate --seed 15 --events 20000000 --clicks 5000000 --output practice-15
      - name: Build and run exact paired decoder screen
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          RAYON_NUM_THREADS: "8"
        run: |
          set -eu
          cargo +1.100.0 build --release --locked --features layout-simd-diag --manifest-path fast/Cargo.toml
          "$CARGO_TARGET_DIR/release/shopping_sessions" --layout-simd-diag \
            "$RUNNER_TEMP/practice-7" "$RUNNER_TEMP/practice-15"
