name: Native amd64 performance check
run-name: Cold-cache diagnostic — 7fd1b76 vs 14ccc10
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coldcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record environment and build exact packaged images
        shell: bash
        run: |
          set -euo pipefail
          echo "workflow commit $(git rev-parse HEAD)"
          test "$(nproc)" -ge 4
          lscpu | grep -E 'Model name:|CPU\(s\):|Thread\(s\) per core:'
          uname -a
          docker version
          df -hT "$RUNNER_TEMP"
          findmnt -T "$RUNNER_TEMP"
          lsblk -o NAME,TYPE,SIZE,ROTA,MODEL,FSTYPE,MOUNTPOINTS
          git worktree add --detach "$RUNNER_TEMP/control" 7fd1b7602280cfce05ac97b6afb703fa42c0b6ba
          git worktree add --detach "$RUNNER_TEMP/finalist" 14ccc10f1dfc0845760640eeee2fa3db62b3e87a
          git -C "$RUNNER_TEMP/control" rev-parse HEAD HEAD^{tree}
          git -C "$RUNNER_TEMP/finalist" rev-parse HEAD HEAD^{tree}
          docker build --platform linux/amd64 -t coldcheck:control "$RUNNER_TEMP/control"
          docker build --platform linux/amd64 -t coldcheck:finalist "$RUNNER_TEMP/finalist"
          docker image inspect coldcheck:control coldcheck:finalist --format '{{.RepoTags}} {{.Id}}'
      - name: Prepare official generator and comparison tool
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip -o generator.zip
          echo '13724cadbac5a99d847e27cea911cd2e338ff972b46c2039da87452011bb101e  generator.zip' | sha256sum -c -
          curl --fail --silent --show-error --location --retry 2 \
            https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/starter-duckdb.zip -o starter.zip
          echo 'b84ff8726c43749043c33c250548a9ac9987b9132d28ac818a47515bd128f77c  starter.zip' | sha256sum -c -
          unzip -q generator.zip
          unzip -q starter.zip 'starter-duckdb/scripts/*.py'
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 build --release --locked --manifest-path generator/Cargo.toml
          python3 -m venv venv
          venv/bin/pip -q install polars
      - name: Compare cold and warmed images
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 tools/coldcheck_terra.py "$RUNNER_TEMP" \
            "$RUNNER_TEMP/generator/target/release/generate" \
            "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/starter-duckdb/scripts/compare.py" \
            2>&1 | tee "$RUNNER_TEMP/coldcheck.log"
      - name: Preserve diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coldcheck-log
          path: ${{ runner.temp }}/coldcheck.log
          if-no-files-found: warn
