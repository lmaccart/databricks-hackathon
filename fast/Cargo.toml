[package]
name = "shopping_sessions"
version = "0.1.0"
edition = "2024"

[features]
# Exercise the complete gather path without an x86 VBMI host.
event-gather-model = []

[dependencies]
ahash = "0.8.12"
bytes = "1"
memchr = "2.8.3"
memmap2 = "0.9.12"
parquet = { version = "60.1.0", default-features = false, features = [] }
rayon = "1.12.0"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
